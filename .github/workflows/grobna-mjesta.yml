name: Grobna mjesta (prijedlog)

# Ručno pokretanje: Actions -> "Grobna mjesta (prijedlog)" -> Run workflow -> bilje / kopacevo / lug
on:
  workflow_dispatch:
    inputs:
      groblje:
        description: "bilje, kopacevo ili lug"
        required: true
        default: "bilje"
      tocke:
        description: "gustoća traženja (točaka po stranici pločice)"
        default: "40"

permissions:
  contents: write

jobs:
  segmentacija:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/groblja/requirements.txt
      - name: Instalacija
        run: pip install -r scripts/groblja/requirements.txt
      - name: Segmentacija
        run: python scripts/groblja/grobna_mjesta.py --groblje "${{ inputs.groblje }}" --tocke "${{ inputs.tocke }}"
      - name: Spremanje rezultata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/groblja/${{ inputs.groblje }}_grobna_mjesta.geojson"
          git commit -m "Prijedlog grobnih mjesta: ${{ inputs.groblje }}" || echo "Nema promjena"
          git pull --rebase
          git push
