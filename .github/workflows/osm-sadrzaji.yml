name: Javni sadržaji iz OpenStreetMapa

# Jednom mjesečno (i ručno) osvježava javne sadržaje, ugostiteljstvo, smještaj i znamenitosti iz OpenStreetMapa.
on:
  schedule:
    - cron: "23 4 2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/osm/sadrzaji.py
      - name: Spremanje
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sadrzaji
          git commit -m "Javni sadržaji iz OpenStreetMapa (automatski)" || echo "Nema promjena"
          git pull --rebase && git push
