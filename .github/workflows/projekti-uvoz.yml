name: Uvoz projekata u bazu

# Ručno: uvozi data/projekti/uvoz.csv (iz ispunjene tablice projekata) u tablicu 'projekti'.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  uvoz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/projekti/uvoz.py data/projekti/uvoz.csv
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
