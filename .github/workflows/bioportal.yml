name: Bioportal (zaštita prirode)

# Mjesečno preuzima slojeve Bioportala (MZOZT) za područje općine u data/bioportal/.
on:
  schedule:
    - cron: "41 4 7 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bioportal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/bioportal/preuzmi.py
      - name: Spremanje
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bioportal
          git diff --cached --quiet || (git commit -qm "Bioportal: osvježeni slojevi" && git pull -q --rebase && git push -q)
