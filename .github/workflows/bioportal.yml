name: Otvoreni podaci (Bioportal, RGI)

# Mjesečno preuzima slojeve Bioportala (MZOZT) za područje općine u data/bioportal/.
on:
  schedule:
    - cron: "41 4 7 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bioportal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/bioportal/preuzmi.py
      - run: python3 scripts/rgi/preuzmi.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null && scripts/bioportal/izrezi.sh
      - name: Spremanje
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/bioportal data/rgi
          git diff --cached --quiet || (git commit -qm "Bioportal: osvježeni slojevi" && git pull -q --rebase && git push -q)
