name: Priprema grafike

# Ručno pokretanje: preuzima grb Općine Bilje sa službene stranice i sprema ga u assets/.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  grb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/preuzmi_grb.py
      - name: Spremanje
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Grb Općine Bilje (assets)" || echo "Nema promjena"
          git pull --rebase
          git push
