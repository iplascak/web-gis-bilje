name: ARKOD parcele (APPRRR)

# Preuzima ARKOD GeoPackage s apprrr.hr (trenutno stanje + arhiva 31.12.), izrezuje na Općinu Bilje
# i sprema samo vrstu uporabe i površinu (bez podataka o korisnicima).
on:
  schedule:
    - cron: "17 3 5 * *"   # mjesečno: trenutno stanje
  workflow_dispatch:
    inputs:
      godine:
        description: "Godine arhive (npr. 2013-2025) ili 'trenutno' ili 'proba'"
        default: "trenutno"

permissions:
  contents: write

jobs:
  arkod:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal > /dev/null
      - run: python3 scripts/arkod/arkod.py "${{ github.event.inputs.godine || 'trenutno' }}"
      - name: Spremanje
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poljoprivreda/arkod || true
          git diff --cached --quiet || (git commit -qm "ARKOD: osvježeni podaci" && git pull -q --rebase && git push -q)
