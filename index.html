<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web GIS Općine Bilje</title>
  <meta name="description" content="Interaktivna karta Općine Bilje – prostorni podaci za mještane i posjetitelje.">
  <meta name="theme-color" content="#F5D654">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="stylesheet" href="lib/ol/ol.css">
  <link rel="stylesheet" href="css/app.css?v=20261114s">
</head>
<body>
  <header class="zaglavlje">
    <button id="gumbPanel" class="gumb-ikona" aria-label="Prikaži ili sakrij slojeve" title="Slojevi">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="grb" href="https://bilje.hr/" title="Općina Bilje – službena stranica" target="_blank" rel="noopener">
      <img src="assets/grb.png" alt="Grb Općine Bilje" onerror="this.parentElement.hidden=true">
    </a>
    <div class="naslovi">
      <h1 id="naslov">Web GIS Općine Bilje</h1>
      <p id="podnaslov"></p>
    </div>
    <button id="gumbPrijavi" class="gumb-tekst gumb-naglaseni" data-prijave hidden title="Prijavite komunalni problem općini">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3l10 18H2L12 3zm0 6v5m0 3v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Prijavi problem</span>
    </button>
    <button id="gumbRacun" class="gumb-tekst" data-prijave hidden title="Prijava na portal i moje prijave">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Prijava</span>
    </button>
    <button id="gumbPodijeli" class="gumb-tekst" title="Kopiraj poveznicu na ovaj prikaz">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4M18 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM9 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm9 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Podijeli</span>
    </button>
    <button id="gumbOPortalu" class="gumb-tekst"><span>O portalu</span></button>
  </header>

  <main class="sadrzaj">
    <aside id="panel" class="panel" aria-label="Slojevi i legenda">
      <section class="pretraga-okvir">
        <svg class="ikona-pretrage" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="pretraga" type="search" placeholder="Traži adresu, ulicu ili naselje…" autocomplete="off" aria-label="Pretraga">
        <ul id="pretragaRezultati" class="pretraga-rezultati" role="listbox" hidden></ul>
      </section>
      <nav id="brziPrikazi" class="brzi-prikazi" aria-label="Brzi prikazi" hidden></nav>
      <section id="aktivniSlojevi" class="aktivni" aria-label="Uključeni slojevi" hidden></section>
      <section class="slojevi-okvir" aria-label="Slojevi">
        <div class="filtar-okvir">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5zm-9 9 9 5 9-5m-18 4 9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <input id="filtarSlojeva" type="search" placeholder="Pronađi sloj…" aria-label="Pronađi sloj" autocomplete="off">
        </div>
        <div id="slojevi"></div>
      </section>
      <footer class="podnozje-panela">
        Izrađeno s alatima otvorenog koda · <a href="https://bilje.hr/" target="_blank" rel="noopener">bilje.hr</a>
      </footer>
    </aside>

    <div id="karta" class="karta" aria-label="Karta"></div>
  </main>

  <div id="koordinate" class="koordinate" title="Koordinate u HTRS96/TM"></div>
  <div class="gumbi-karte">
    <button id="gumbOvdje" class="gumb-karte" title="Kliknite pa odaberite mjesto na karti (ili desni klik / dugi pritisak bilo gdje)">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.5" r="2.5" fill="currentColor"/></svg>
      <span>Što je ovdje?</span>
    </button>
    <button id="gumbOpcina" class="gumb-karte" title="Prikaži cijelu općinu">⌂ <span>Cijela općina</span></button>
  </div>

  <div id="skocni" class="skocni" hidden>
    <button class="zatvori" aria-label="Zatvori">×</button>
    <div class="skocni-sadrzaj"></div>
  </div>

  <dialog id="dijalog" class="dijalog">
    <button class="zatvori" aria-label="Zatvori">×</button>
    <div class="dijalog-sadrzaj"></div>
  </dialog>

  <script src="lib/proj4/proj4.js"></script>
  <script src="lib/ol/ol.js"></script>
  <script src="lib/supabase/supabase.js"></script>
  <script src="js/otpad.js?v=20261114s"></script>
  <script src="js/zrak.js?v=20261114s"></script>
  <script src="js/vrijeme.js?v=20261114s"></script>
  <script src="js/adresa.js?v=20261114s"></script>
  <script src="js/alati.js?v=20261114s"></script>
  <script src="js/prijave.js?v=20261114s"></script>
  <script src="js/zajednica.js?v=20261114s"></script>
  <script src="js/izvoz.js?v=20261114s"></script>
  <script src="js/app.js?v=20261114s"></script>
</body>
</html>
